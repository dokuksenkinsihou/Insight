function review(back,f){f=f||0;const all=D.filter(d=>st[d.id]),L=f?all.filter(d=>d.c==f):all;
 const cs=CH.filter(c=>all.some(d=>d.c==c.n));
 const chips=cs.length?`<div class="chips"><button class="chip ${f?'':'on'}" data-f="0">すべて ${all.length}</button>${cs.map(c=>`<button class="chip ${f==c.n?'on':''}" data-f="${c.n}">第${c.n}章 ${all.filter(d=>d.c==c.n).length}</button>`).join('')}</div>`:'';
 let body='';
 if(!L.length)body='<p class="no">★をつけた問題はまだありません。</p>';
 else{let last=0;for(const d of L){if(!f&&d.c!=last){last=d.c;body+=`<h2 class="gh">第${d.c}章 ${esc(CH.find(c=>c.n==d.c).t)}</h2>`}
  body+=`<div class="it"><div class="no">${d.id}</div><b>${esc(d.ja)}</b>${d.en.map(e=>`<div class="en" style="line-height:1.6;font-size:16px">${rend(e,false)}</div>`).join('')}</div>`}}
 app.innerHTML=`<div class="top"><button id="h">← 戻る</button><span>★ ${L.length}問</span><span></span></div><h1>★の見返し</h1>${chips}${body}`;
 app.querySelectorAll('.chip').forEach(x=>x.onclick=()=>{review(back,+x.dataset.f);scrollTo(0,0)});
 $('#h').onclick=()=>back===true&&queue.length&&i<queue.length?show():home()}
const norm=s=>s.replace(/[()‹›\[\]]/g,'').replace(/’/g,"'").replace(/\s+/g,' ').toLowerCase();
const IDX=D.map(d=>norm(d.ja+' '+d.en.join(' ')));
const eRe=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const isW=w=>/^[\x00-\x7F]+$/.test(w);
const wp=w=>{const t=eRe(w),l=w.slice(-1),a=[t+'(?:s|es|ed|d|ing)?'];
 if(l=='e')a.push(eRe(w.slice(0,-1))+'ing');
 if(l=='y')a.push(eRe(w.slice(0,-1))+'(?:ies|ied)');
 if(/[a-z]/.test(l))a.push(t+eRe(l)+'(?:ed|ing)');
 return a.join('|')};
function search(){
 app.innerHTML=`<div class="top"><button id="h">← 戻る</button><span id="sc"></span><span></span></div><h1>単語で検索</h1>
 <input id="q" type="search" placeholder="日本語・英語の単語（例：give up、責任）" autocomplete="off"><div id="rs"></div>`;
 $('#h').onclick=home;
 const run=()=>{const terms=norm($('#q').value).split(' ').filter(Boolean);
  if(!terms.length){$('#rs').innerHTML='<p class="no">単語を入力すると、日本語文・英文（別解も含む）から探します。英語は単語単位で探し（s・ed・ingなどの変化形は含む）、別の単語の一部は除きます。複数の単語はスペースで区切ると、すべてを含む問題が出ます。</p>';$('#sc').textContent='';return}
  const ws=terms.filter(isW),js=terms.filter(w=>!isW(w));
  const tests=[...ws.map(w=>{const r=new RegExp('(^|[^a-z])(?:'+wp(w)+')(?![a-z])');return s=>r.test(s)}),...js.map(w=>s=>s.includes(w))];
  const hits=[];for(let k=0;k<D.length&&hits.length<200;k++)if(tests.every(f=>f(IDX[k])))hits.push(D[k]);
  $('#sc').textContent=hits.length>=200?'200件以上（先頭200件）':hits.length+'件';
  const E=ws.length?ws.map(wp).join('|'):'(?!)',J=js.length?js.map(eRe).join('|'):'(?!)';
  const re=new RegExp('(^|[^a-z])('+E+')(?![a-z])|('+J+')','gi');
  const hl=h=>h.split(/(<[^>]*>)/).map((p,i)=>i%2?p:p.replace(re,(m,pre,e,j)=>e?pre+'<mark>'+e+'</mark>':'<mark>'+j+'</mark>')).join('');
  $('#rs').innerHTML=hits.length?hits.map(d=>`<div class="it"><button class="star ${st[d.id]?'on':''}" data-id="${d.id}">★</button><div class="no">第${d.c}章 ・ ${d.id}</div><b>${hl(esc(d.ja))}</b>${d.en.map(e=>`<div class="en" style="line-height:1.6;font-size:16px">${hl(rend(e,false))}</div>`).join('')}</div>`).join(''):'<p class="no">見つかりませんでした。</p>';
  $('#rs').querySelectorAll('.star').forEach(b=>b.onclick=()=>{const id=b.dataset.id;st[id]=!st[id];if(!st[id])delete st[id];b.classList.toggle('on',!!st[id]);save()})};
 $('#q').oninput=run;run();$('#q').focus()}
let bc=CH[0].n;
function browse(){
 const L=D.filter(d=>d.c==bc),k=CH.findIndex(c=>c.n==bc),g=L.filter(d=>cn[d.id]>0).length,dis=x=>x?'':'disabled style="opacity:.4"';
 app.innerHTML=`<div class="top"><button id="h">← 戻る</button><span>解いた ${g}/${L.length}問</span><span></span></div><h1>章ごとに見る</h1>
 <select id="cs">${CH.map(c=>`<option value="${c.n}" ${c.n==bc?'selected':''}>第${c.n}章 ${esc(c.t)}</option>`).join('')}</select>
 <div class="row"><button class="btn g" id="pv" ${dis(k>0)}>← 前の章</button><button class="btn g" id="nx" ${dis(k<CH.length-1)}>次の章 →</button></div>
 <div id="rs">${L.map(d=>`<div class="it"><button class="star ${st[d.id]?'on':''}" data-id="${d.id}">★</button><div class="no">${d.id}${cn[d.id]>0?' ・ ✓解答済み':''}</div><b>${esc(d.ja)}</b>${d.en.map(e=>`<div class="en" style="line-height:1.6;font-size:16px">${rend(e,false)}</div>`).join('')}</div>`).join('')}</div>`;
 const go=n=>{bc=n;browse();scrollTo(0,0)};
 $('#h').onclick=home;$('#cs').onchange=e=>go(+e.target.value);
 $('#pv').onclick=()=>k>0&&go(CH[k-1].n);$('#nx').onclick=()=>k<CH.length-1&&go(CH[k+1].n);
 $('#rs').querySelectorAll('.star').forEach(b=>b.onclick=()=>{const id=b.dataset.id;st[id]=!st[id];if(!st[id])delete st[id];b.classList.toggle('on',!!st[id]);save()})}
function backup(){
 const out='GH1:'+JSON.stringify({s:Object.keys(st).filter(k=>st[k]),n:Object.fromEntries(Object.entries(cn).filter(([k,v])=>v>0))});
 app.innerHTML=`<div class="top"><button id="h">← 戻る</button><span></span><span></span></div><h1>記録の引き継ぎ</h1>
 <h2 class="gh">① 書き出し</h2><div class="no">下の文字をコピーして、メモ帳などに保存してください。</div>
 <textarea id="ex" readonly style="min-height:110px">${esc(out)}</textarea><button class="btn" id="cp">コピー</button><div class="no" id="m1"></div>
 <h2 class="gh">② 読み込み</h2><div class="no">書き出した文字を貼り付けてください。今の記録と合わせます（★は両方を合算、回数は大きいほうを採用）。</div>
 <textarea id="im" placeholder="ここに貼り付け"></textarea><button class="btn" id="ld">読み込む</button><div class="no" id="m2"></div>`;
 $('#h').onclick=home;
 $('#cp').onclick=async()=>{const x=$('#ex');x.select();x.setSelectionRange(0,1e7);let ok=false;try{await navigator.clipboard.writeText(out);ok=true}catch(e){try{ok=document.execCommand('copy')}catch(e2){}}
  $('#m1').textContent=ok?'コピーしました':'コピーできない場合は、上の文字を長押しして全選択→コピーしてください'};
 $('#ld').onclick=()=>{try{const raw=$('#im').value.trim(),i=raw.indexOf('GH1:');if(i<0)throw 0;
  const o=JSON.parse(raw.slice(i+4)),ok=new Set(D.map(d=>d.id));let a=0,b=0;
  for(const id of o.s||[])if(ok.has(id)&&!st[id]){st[id]=true;a++}
  for(const [id,v] of Object.entries(o.n||{}))if(ok.has(id)&&v>(cn[id]||0)){cn[id]=v;b++}
  save();$('#m2').textContent=`取り込みました：★ ${a}件を追加、回数 ${b}件を更新`}catch(e){$('#m2').textContent='読み込めませんでした。書き出した文字を最初から最後まで貼り付けてください。'}}}
home();
</script></body></html>
